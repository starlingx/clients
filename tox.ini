[tox]
envlist = linters, pep8
minversion = 2.3
skipsdist = True

[testenv]
install_command = pip install \
    -c{env:UPPER_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/upper-constraints.txt} \
    {opts} {packages}

setenv = VIRTUAL_ENV={envdir}
         OS_STDOUT_CAPTURE=1
         OS_STDERR_CAPTURE=1
         OS_TEST_TIMEOUT=60
deps = -r{toxinidir}/test-requirements.txt

[trixie]
basepython = python3
setenv = {[testenv]setenv}
         UPPER_CONSTRAINTS_FILE=https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/trixie/upper-constraints.txt
install_command = pip install \
    -c{env:UPPER_CONSTRAINTS_FILE} \
    {opts} {packages}

[testenv:linters]
basepython = python3
allowlist_externals = bash
commands =
  bash -c "find {toxinidir}          \
         -not \( -type d -name .?\* -prune \) \
         -type f                              \
         -not -name \*~                       \
         -not -name \*.md                     \
         -name \*.sh                          \
         -print0 | xargs -0r bashate -iE006 -v"
  bash -c "find {toxinidir}        \
            \( -name .tox -prune \)         \
            -o -type f -name '*.yaml'       \
            -print0 | xargs -0r yamllint"

[flake8]
exclude=.tox
# H102 Apache 2.0 license header not found
ignore=H102

[testenv:pep8]
basepython = python3
usedevelop = False
skip_install = True
commands =
    flake8

[testenv:venv]
basepython = python3
commands = {posargs}

[testenv:docs]
basepython = python3
deps = -r{toxinidir}/doc/requirements.txt
commands =
    rm -rf doc/build
    sphinx-build -a -E -W -d doc/build/doctrees -b html doc/source doc/build/html
allowlist_externals = rm

[testenv:releasenotes]
basepython = python3
deps = -r{toxinidir}/doc/requirements.txt
commands =
    rm -rf releasenotes/build
    sphinx-build -a -E -W -d releasenotes/build/doctrees -b html releasenotes/source releasenotes/build/html
allowlist_externals =
    rm
    reno

[testenv:newnote]
basepython = python3
# Re-use the releasenotes venv
envdir = {toxworkdir}/releasenotes
deps = -r{toxinidir}/doc/requirements.txt
commands = reno new {posargs}

[testenv:bandit]
basepython = python3
description = Bandit code scan for *.py files
deps = -r{toxinidir}/test-requirements.txt
       bandit
allowlist_externals = bash
                      mkdir
                      bandit
commands =
  mkdir -p {toxinidir}/UTCoverage
  bandit -r {toxinidir}/ -x '**/.tox/**,**/.eggs/**,**/tests/**' -f txt -o {toxinidir}/UTCoverage/security_report.txt -lll
  bandit -r {toxinidir}/ -x '**/.tox/**,**/.eggs/**,**/tests/**' -f json -o {toxinidir}/UTCoverage/bandit-report.json -lll

[testenv:coverage]
basepython = python3
deps = -r{toxinidir}/test-requirements.txt
       pytest
       pytest-cov
allowlist_externals = bash
                      mkdir
                      pytest
commands =
  mkdir -p {toxinidir}/UTCoverage
  pytest {toxinidir}/tests -v --tb=short \
    --cov={toxinidir}/doc/source \
    --cov={toxinidir}/releasenotes/source \
    --cov-report=term-missing \
    --cov-report=html:{toxinidir}/UTCoverage/htmlcov \
    {posargs}

[testenv:linters-trixie]
basepython = {[trixie]basepython}
description = Run linters (Trixie)
deps = -r{toxinidir}/test-requirements.txt
setenv = {[trixie]setenv}
install_command = {[trixie]install_command}
allowlist_externals = {[testenv:linters]allowlist_externals}
commands = {[testenv:linters]commands}

[testenv:pep8-trixie]
basepython = {[trixie]basepython}
usedevelop = False
skip_install = True
description = Run style checks (Trixie)
deps = -r{toxinidir}/test-requirements.txt
setenv = {[trixie]setenv}
install_command = {[trixie]install_command}
allowlist_externals = {[testenv:pep8]allowlist_externals}
commands = {[testenv:pep8]commands}

[testenv:bandit-trixie]
basepython = {[trixie]basepython}
description = Bandit code scan (Trixie)
deps = -r{toxinidir}/test-requirements.txt
       bandit
setenv = {[trixie]setenv}
install_command = {[trixie]install_command}
allowlist_externals = {[testenv:bandit]allowlist_externals}
commands = {[testenv:bandit]commands}

[testenv:coverage-trixie]
basepython = {[trixie]basepython}
description = Run all tests with coverage analysis (Trixie)
deps = -r{toxinidir}/test-requirements.txt
       pytest
       pytest-cov
setenv = {[trixie]setenv}
install_command = {[trixie]install_command}
allowlist_externals = {[testenv:coverage]allowlist_externals}
commands = {[testenv:coverage]commands}