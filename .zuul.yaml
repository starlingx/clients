---
- project:
    templates:
      - publish-stx-docs
      - stx-release-notes-jobs
      - stx-bandit-jobs
    check:
      jobs:
        - starlingx-common-tox-linters
        - starlingx-common-tox-pep8
        - clients-tox-bandit
        - clients-tox-coverage
        - clients-tox-linters-trixie
        - clients-tox-pep8-trixie
        - clients-tox-bandit-trixie
        - clients-tox-coverage-trixie
    gate:
      jobs:
        - starlingx-common-tox-linters
        - starlingx-common-tox-pep8
        - clients-tox-bandit
        - clients-tox-coverage
        - clients-tox-linters-trixie
        - clients-tox-pep8-trixie
        - clients-tox-bandit-trixie
        - clients-tox-coverage-trixie
    post:
      jobs:
        - stx-clients-upload-git-mirror

- job:
    name: stx-clients-upload-git-mirror
    parent: upload-git-mirror
    description: >
      Mirrors opendev.org/starlingx/clients to
      github.com/starlingx/clients
    vars:
      git_mirror_repository: starlingx/clients
    secrets:
      - name: git_mirror_credentials
        secret: stx-clients-github-secret3
        pass-to-parent: true

