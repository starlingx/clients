- job:
    name: clients-tox-bandit
    parent: tox
    description: Run bandit security analysis
    nodeset: debian-bullseye
    vars:
      tox_envlist: bandit

- job:
    name: clients-tox-coverage
    parent: tox
    description: Run all tests with coverage analysis
    nodeset: debian-bullseye
    vars:
      tox_envlist: coverage
    post-run: tests/playbooks/upload-coverage-reports.yaml

- job:
    name: clients-tox-linters-trixie
    parent: openstack-tox-py313
    description: Run linters (Trixie)
    nodeset: debian-trixie-8GB
    vars:
      tox_envlist: linters-trixie
      tox_inline_comments: false

- job:
    name: clients-tox-pep8-trixie
    parent: openstack-tox-py313
    description: Run style checks (Trixie)
    nodeset: debian-trixie-8GB
    vars:
      tox_envlist: pep8-trixie

- job:
    name: clients-tox-bandit-trixie
    parent: openstack-tox-py313
    description: Run bandit security analysis (Trixie)
    nodeset: debian-trixie-8GB
    vars:
      tox_envlist: bandit-trixie

- job:
    name: clients-tox-coverage-trixie
    parent: openstack-tox-py313
    description: Run all tests with coverage analysis (Trixie)
    nodeset: debian-trixie-8GB
    vars:
      tox_envlist: coverage-trixie
    post-run: tests/playbooks/upload-coverage-reports.yaml
